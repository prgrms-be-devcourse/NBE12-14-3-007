# 운영(Render) 프로필. Dockerfile이 SPRING_PROFILES_ACTIVE=prod 로 켠다.
# .env는 읽지 않는다. 모든 값은 Render 서비스의 Environment에서 온다.
server:
  # Render가 PORT를 넣어준다. 없으면 8080.
  port: ${PORT:8080}

spring:
  # Supabase의 Session pooler로 연결한다. 예)
  #   DATASOURCE_URL=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
  #   DATASOURCE_USERNAME=postgres.<project-ref>
  #   DATASOURCE_PASSWORD=<Supabase DB 비밀번호>
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

# 운영은 Vercel(rewrite) -> Render 프록시 뒤에 있다. 사용자 IP를 믿을 수 있는 구성을 확인한 뒤에 켠다.
#   CLIENT_IP_MODE=FORWARDED_FOR, CLIENT_IP_PROXY_HOPS=<사용자 IP 뒤에 붙는 프록시 수>
# 켜기 전에는 IP를 쓰지 않아서, 로그인은 이메일만으로 제한하고 가입은 제한하지 않는다.
client-ip:
  mode: ${CLIENT_IP_MODE:NONE}
  proxy-hops: ${CLIENT_IP_PROXY_HOPS:1}

app:
  cors:
    # 프론트는 Vercel rewrite(/api → Render)로 붙어서 같은 출처라 보통 비워 둔다.
    # 다른 도메인에서 직접 부를 일이 생기면 CORS_ALLOWED_ORIGINS에 쉼표로 넣는다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  cookie:
    secure: true
    same-site: Lax
