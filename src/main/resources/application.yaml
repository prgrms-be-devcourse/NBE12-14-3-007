# 로컬·운영 공통 설정.
# 환경마다 다른 값(DB, 쿠키, CORS, .env 로딩)은 프로필 파일로 나눴다.
#   application-local.yaml  로컬 개발 (프로필을 안 주면 이게 켜진다)
#   application-prod.yaml   Railway 운영 (Dockerfile이 SPRING_PROFILES_ACTIVE=prod 로 띄운다)
spring:
  profiles:
    default: local
  application:
    name: roomescape
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    # 스키마만. 시드 데이터(db/seed)는 local 프로필에서만 추가된다.
    locations: classpath:db/migration,classpath:db/migration_v2
  data:
    web:
      pageable:
        # 클라이언트가 size를 크게 넣어 한 번에 다 긁어가는 것을 막는다.
        max-page-size: 50
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    # Gmail 일반 비밀번호가 아니라 앱 비밀번호(16자리, 공백 제거)를 넣는다.
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # SMTP가 응답하지 않을 때 요청이 무한정 붙잡히지 않도록 타임아웃을 건다.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  health:
    mail:
      # 메일 서버 연결을 health에 넣지 않는다.
      # Railway는 SMTP를 막아서 운영에선 항상 DOWN이 되고, 앱 전체가 죽은 것으로 보인다.
      # 메일은 부가 기능이라 안 보내져도 앱은 살아 있어야 한다.
      enabled: false
  endpoints:
    web:
      exposure:
        # 필요한 것만 연다. env, heapdump 등은 민감 정보가 나가므로 열지 않는다.
        include: health, info, prometheus
  metrics:
    tags:
      # Prometheus/Grafana에서 어느 앱의 메트릭인지 구분하는 라벨
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 응답시간 히스토그램을 남겨야 p95/p99를 계산할 수 있다.
        http.server.requests: true

jwt:
  secret: ${JWT_SECRET}
  issuer: roomescape
  access-token-validity-seconds: 300
  refresh-secret: ${JWT_REFRESH_SECRET}
  refresh-token-validity-seconds: 1209600
  refresh-cleanup-cron: "0 0 4 * * *"

app:
  cookie:
    # secure / same-site 는 환경마다 달라서 프로필 파일에 있다.
    path: /api/v1/auth

trust-grade:
  # 신뢰 등급 집계 주기. 매일 0시(한국 시간)에 모든 행사 작성자의 등급을 한 번에 계산한다.
  cron: "0 0 0 * * *"

privacy:
  # 탈퇴 후 개인정보를 보관하는 기간(개월).
  # 이 기간이 지나면 이메일·전화번호·닉네임·프로필 이미지를 지운다.
  # 지우기 전까지는 이메일 자리가 차 있어 같은 주소로 재가입할 수 없다.
  # 즉 이 값이 곧 재가입 차단 기간이다.
  withdrawn-retention-months: 6
  # 파기 배치 실행 주기. 리프레시 토큰 정리(4시)와 겹치지 않게 4시 30분에 돈다.
  purge-cron: "0 30 4 * * *"

auth-mail:
  # 인증 코드 유효시간(분). 로컬 캐시에만 있으므로 앱을 재시작하면 발급된 코드는 무효가 된다.
  expire-minutes: 2
  # 재발송 제한(초). 이걸 안 막으면 메일 폭탄으로 계정이 정지된다.
  resend-cooldown-seconds: 60
  # 인증 통과 후 새 비밀번호를 입력할 때까지 주는 시간(분)
  verified-valid-minutes: 5
  # 인증 코드를 이만큼 틀리면 그 코드를 폐기한다. 6자리 숫자라 횟수를 막지 않으면 대입으로 뚫린다.
  max-code-attempts: 5

auth-rate-limit:
  # 로그인을 이 시간 안에 이만큼 틀리면, 시간이 끝날 때까지 로그인을 막는다. (429)
  login-max-failures: 5
  login-window: 5m
  # 같은 IP의 가입 시도 횟수. client-ip 를 켜지 않으면 가입은 제한하지 않는다.
  signup-max-attempts: 5
  signup-window: 1h

# 사용자 IP를 어디서 읽을지. 프록시 뒤에서는 연결된 상대의 IP가 모든 사용자에게 같아서,
# 믿을 수 있을 때만 켠다. NONE 이면 IP 없이 이메일만으로 로그인을 제한하고 가입은 제한하지 않는다.
#   NONE          IP를 쓰지 않는다 (기본)
#   REMOTE_ADDR   연결된 상대의 IP (프록시 없이 직접 접속하는 로컬)
#   FORWARDED_FOR X-Forwarded-For 의 오른쪽에서 proxy-hops 번째 주소 (운영)
client-ip:
  mode: NONE
  proxy-hops: 1

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}
  public-url: ${R2_PUBLIC_URL}

storage:
  upload:
    # 회원당 최근 24시간 동안 올릴 수 있는 이미지 수
    daily-limit: 30
    # 올린 이미지의 최대 해상도(가로 x 세로 화소 수). 넘으면 이미지를 읽지 않고 거절한다.
    max-pixels: 25000000

public-api:
  # 전국 문화정보 API(한국문화정보원)
  culture-info:
    url: https://apis.data.go.kr/B553457/cultureinfo
    service-key: ${CULTURE_INFO_SERVICE_KEY}
    sync-cron: "0 0 6,14,22 * * *"  #배치 실행 주기 6/14/22시 (임의..)

  weather:
    url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0/getVilageFcst
    service-key: ${KMA_WEATHER_SERVICE_KEY}
